<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      margin: 0;
      padding: 14px;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    textarea {
      width: 100%;
      height: 110px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #f0f6fc;
      padding: 8px;
      box-sizing: border-box;
      font-size: 12px;
      resize: vertical;
    }
    .btn-row {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      gap: 6px;
    }
    button {
      flex: 1;
      background: #238636;
      border: 1px solid #2ea043;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: #2ea043; }
    #stats {
      font-size: 11px;
      color: #8b949e;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h3>🛡️ AntiWatermark Quick Clean</h3>
  <textarea id="textInput" placeholder="Paste text here..."></textarea>
  <div class="btn-row">
    <button id="cleanBtn">🧹 Strip Watermark</button>
    <button id="copyBtn" style="background:#21262d; border-color:#30363d;">📋 Copy</button>
  </div>
  <div id="stats">Human Confidence: 100% | Clean</div>
  <script src="popup.js"></script>
</body>
</html>
