<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AntiWatermark</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --surface-hover: #27272a;
      --border: #3f3f46;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --primary: #10b981;
      --primary-hover: #059669;
    }
    body {
      width: 350px;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    textarea {
      width: 100%;
      height: 80px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 8px;
      box-sizing: border-box;
      resize: none;
      margin-bottom: 12px;
      font-family: inherit;
    }
    textarea:focus { outline: none; border-color: var(--primary); }
    .mode-select {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    button {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    #result-container {
      margin-top: 12px;
      display: none;
    }
    #result-area {
      height: 80px;
    }
    
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--surface-hover);
    }

    .settings-panel {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: none;
    }
    .settings-panel.active { display: block; }
    .setting-group { margin-bottom: 12px; }
    .setting-group label { display: block; margin-bottom: 4px; color: var(--text-muted); }
    .setting-group input[type="text"] {
      width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 4px; box-sizing: border-box;
    }
    a.link { color: var(--primary); text-decoration: none; font-size: 13px; display: inline-block; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛡️ AntiWatermark</h1>
  </div>

  <textarea id="input-text" placeholder="Paste text here..."></textarea>
  
  <div class="mode-select">
    <label><input type="radio" name="mode" value="clean" checked> Quick Clean</label>
    <label><input type="radio" name="mode" value="rewrite"> Deep Rewrite</label>
  </div>

  <button id="process-btn">Process</button>

  <div id="result-container">
    <textarea id="result-area" readonly></textarea>
    <div class="actions">
      <button id="copy-btn" class="btn-secondary">Copy Result</button>
      <button id="settings-toggle" class="btn-secondary">⚙ Settings</button>
    </div>
  </div>

  <div class="settings-panel" id="settings-panel">
    <div class="setting-group">
      <label>Model Name (for Rewrite)</label>
      <input type="text" id="model-name" value="llama3.2">
    </div>
    <div class="setting-group" style="flex-direction: row; align-items: center;">
      <label style="display: flex; align-items: center; gap: 8px; color: var(--text);">
        <input type="checkbox" id="auto-clean" checked> Auto-clean clipboard
      </label>
    </div>
    <a href="http://localhost:3000" target="_blank" class="link">Open Web UI ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
