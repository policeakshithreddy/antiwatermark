[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antiwatermark"
version = "1.0.0"
authors = [
  { name = "OpenSource Contributor" },
]
description = "Universal AI Watermark Remover, Google SynthID Neutralizer & Detector Simulator for Claude, Gemini and ChatGPT."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
keywords = [
    "ai-watermark-remover",
    "synthid",
    "claude",
    "gemini",
    "chatgpt",
    "humanizer",
    "undetectable-ai",
    "gptzero",
    "turnitin",
    "steganography"
]

[project.scripts]
antiwatermark = "antiwatermark.cli:main"

[project.urls]
"Homepage" = "https://github.com/your-username/antiwatermark"
"Bug Tracker" = "https://github.com/your-username/antiwatermark/issues"
