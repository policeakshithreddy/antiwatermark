[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antiwatermark"
version = "2.0.0"
authors = [
  { name = "OpenSource Contributor" },
]
description = "Local-only AI text watermark remover, steganography stripper, and humanizer. Strips invisible Unicode markers, replaces AI clichés, and optionally rewrites via local LLM backends. No cloud dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
keywords = [
    "ai-watermark-remover",
    "text-sanitizer",
    "humanizer",
    "steganography",
    "local-only",
    "unicode-cleaner",
    "invisible-characters",
    "llm-tools"
]
dependencies = []

[project.optional-dependencies]
neural = ["requests>=2.28"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "build>=1.0", "twine>=5.0"]

[project.scripts]
antiwatermark = "antiwatermark.cli:main"

[project.urls]
"Homepage" = "https://github.com/policeakshithreddy/antiwatermark"
"Bug Tracker" = "https://github.com/policeakshithreddy/antiwatermark/issues"

[tool.setuptools.packages.find]
include = ["antiwatermark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
